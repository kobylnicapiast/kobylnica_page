<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Catering Klubowy</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#edf2f7;
}

.header{
    background:linear-gradient(135deg,#0d6efd,#003b99);
    color:white;
    border-radius:20px;
    padding:35px;
    text-align:center;
    margin-bottom:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.table thead{
    background:#0d6efd;
    color:white;
}

.table tbody tr:hover{
    background:#f5f9ff;
}

.price{
    text-align:right;
    font-weight:bold;
    color:#198754;
    font-size:1.1rem;
}

</style>

</head>

<body>

<div class="container py-5">

    <!-- Przycisk Powrót -->
    <a href="index.html" class="btn btn-outline-primary rounded-pill px-4 mb-4">
        <i class="bi bi-arrow-left"></i>
        Powrót
    </a>

    <!-- Nagłówek -->
    <div class="header">
        <h1>
            <i class="bi bi-cup-hot-fill"></i>
            Catering Klubowy
        </h1>

        <p class="mb-0">
            Aktualny cennik produktów
        </p>
    </div>

    <!-- Tabela -->
    <div class="card p-4">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                    <tr>
                        <th width="70">#</th>
                        <th>
                            <i class="bi bi-basket"></i>
                            Produkt
                        </th>
                        <th class="text-end" width="150">
                            <i class="bi bi-cash-coin"></i>
                            Cena
                        </th>
                    </tr>
                </thead>

                <tbody id="lista">
                    <tr>
                        <td colspan="3" class="text-center py-4">
                            <div class="spinner-border text-primary"></div>
                            <br><br>
                            Ładowanie cennika...
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQWheRkia3xhfsYd-J9pEa8LPKlA5A-vWPB5rFHy7ZZd4-42EM2scZK7J1Hp_h8IjJeCzDnf_aWEm2l/pub?output=csv";

fetch(csvUrl)
.then(response => response.text())
.then(text => {

    const rows = text.trim().split("\n");
    const tbody = document.getElementById("lista");

    tbody.innerHTML = "";

    let nr = 1;

    rows.forEach((row, index) => {

        // pomijamy pierwszy wiersz (nagłówki)
        if(index === 0) return;

        const cols = row.split(",");

        const produkt = (cols[0] || "").replace(/"/g,"").trim();
        const cena = (cols[1] || "").replace(/"/g,"").trim();

        if(produkt === "") return;

        tbody.innerHTML += `
            <tr>
                <td>${nr++}</td>
                <td>${produkt}</td>
                <td class="price">${cena} zł</td>
            </tr>
        `;

    });

})
.catch(error => {

    document.getElementById("lista").innerHTML = `
        <tr>
            <td colspan="3" class="text-center text-danger py-4">
                <i class="bi bi-exclamation-triangle-fill fs-2"></i>
                <br><br>
                Nie udało się pobrać cennika.
            </td>
        </tr>
    `;

    console.error(error);

});

</script>

</body>
</html>
