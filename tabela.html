<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tabela Ligowa</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#edf2f7;
    font-family:system-ui,-apple-system,sans-serif;
}

/* ==========================
   HEADER
========================== */

.header{
    background:linear-gradient(135deg,#0d6efd,#084298);
    color:#fff;
    border-radius:22px;
    padding:35px;
    text-align:center;
    margin-bottom:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.header h1{
    font-weight:800;
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

/* ==========================
   SEKCJA TWOJEGO KLUBU
========================== */

.my-team-section{
    margin-bottom:30px;
}

.my-team-title{
    font-size:1rem;
    font-weight:800;
    color:#003b99;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:10px;
}

.my-team-card{
    background:linear-gradient(135deg,#003b99,#001f5c);
    color:#fff;
    border-radius:18px;
    padding:20px 24px;
    box-shadow:0 10px 25px rgba(0,31,92,.30);
}

.my-team-card .team-name{
    font-size:1.3rem;
    font-weight:800;
}

.my-team-card .position{
    font-size:1.5rem;
    font-weight:900;
}

.my-team-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
    margin-top:18px;
}

.my-team-info{
    background:rgba(255,255,255,.12);
    border-radius:12px;
    padding:10px;
    text-align:center;
}

.my-team-info small{
    display:block;
    opacity:.75;
    font-size:.75rem;
}

.my-team-info strong{
    font-size:1.05rem;
}

.my-team-info.points strong{
    color:#37e996;
    font-size:1.25rem;
    font-weight:800;
}

/* ==========================
   TABELA PC
========================== */

.desktop-table{
    display:block;
}

.table{
    margin-bottom:0;
}

.table thead th{
    background:#0d6efd;
    color:#fff;
    white-space:nowrap;
    text-align:center;
    border:none;
}

.table td{
    vertical-align:middle;
}

.table tbody tr{
    transition:.25s;
}

.table tbody tr:hover:not(.team-highlight){
    background:#f4f8ff;
}

.table td:nth-child(2){
    text-align:left;
    font-weight:600;
}

.position{
    font-weight:700;
}

.points{
    color:#37e996;
    font-weight:700;
}

/* ==========================
   WYRÓŻNIENIE PIasta
========================== */

.team-highlight{
    background:linear-gradient(90deg,#003b99,#0056c7)!important;
    color:#fff!important;
    font-weight:600;
}

.team-highlight td{
    background:transparent!important;
    color:#fff!important;
    border-top:2px solid #00265f;
    border-bottom:2px solid #00265f;
}

.team-highlight .points{
    color:#37e996!important;
    font-weight:900;
}

.team-highlight .position{
    color:#fff;
    font-size:1.05rem;
}

/* ==========================
   ODSTĘP PRZED PEŁNĄ TABELĄ
========================== */

.full-table-section{
    margin-top:35px;
}

.full-table-title{
    font-size:1.1rem;
    font-weight:800;
    color:#343a40;
    margin-bottom:12px;
}

/* ==========================
   WIDOK MOBILNY
========================== */

.mobile-table{
    display:none;
}

.team-card{

    background:#fff;

    border-radius:18px;

    padding:18px;

    margin-bottom:16px;

    box-shadow:0 8px 18px rgba(0,0,0,.08);

    animation:fade .35s ease;

}

.team-card.piast{

    background:linear-gradient(135deg,#003b99,#001f5c);

    color:#fff;

    box-shadow:0 10px 22px rgba(0,31,92,.25);

}

.team-card.piast .info{

    background:rgba(255,255,255,.12);

}

.team-card.piast .info small{

    color:rgba(255,255,255,.75);

}

.team-card.piast .info strong{

    color:#fff;

}

.team-card.piast .team-title span{

    color:#fff;

}

.team-title{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;

}

.team-title h5{

    margin:0;

    font-weight:800;

    font-size:1.05rem;

}

.team-title span{

    font-size:1.25rem;

    font-weight:800;

    color:#0d6efd;

}

.team-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

}

.info{

    background:#f7f9fc;

    border-radius:12px;

    padding:10px;

}

.info small{

    display:block;

    color:#6c757d;

}

.info strong{

    font-size:1rem;

}

.loader{

    text-align:center;

    padding:50px;

}

@keyframes fade{

    from{

        opacity:0;

        transform:translateY(12px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}

/* ==========================
   RESPONSYWNOŚĆ
========================== */

@media(max-width:768px){

    .desktop-table{

        display:none;

    }

    .mobile-table{

        display:block;

    }

    .container{

        padding-left:12px;
        padding-right:12px;

    }

    .header{

        padding:22px;

    }

    .header h1{

        font-size:1.6rem;

    }

    .btn{

        width:100%;

    }

    .my-team-card{

        padding:18px;

    }

    .my-team-grid{

        grid-template-columns:1fr 1fr;

    }

}

/* ==========================
   DESKTOP - SEKCJA KLUBU
========================== */

@media(min-width:769px){

    .my-team-grid .wide{
        grid-column:auto;
    }

}

</style>

</head>

<body>

<div class="container py-4">

<a href="index.html" class="btn btn-outline-primary rounded-pill mb-4">
<i class="bi bi-arrow-left"></i>
Powrót
</a>

<div class="header">

<h1>
<i class="bi bi-trophy-fill"></i>
Tabela Ligowa
</h1>

<p class="mb-0">
Aktualna tabela sezonu
</p>

</div>


<!-- ==========================
     TWÓJ KLUB
========================== -->

<div class="my-team-section">

<div class="my-team-title">
<i class="bi bi-star-fill"></i>
Nasz klub
</div>

<div id="myTeamDesktop" class="my-team-card">

<div class="loader">
<div class="spinner-border"></div>
<br><br>
Ładowanie...
</div>

</div>

</div>


<!-- ==========================
     PEŁNA TABELA
========================== -->

<div class="full-table-section">

<div class="full-table-title">

<i class="bi bi-list-ol"></i>
Pełna tabela ligowa

</div>


<!-- KOMPUTER -->

<div class="card p-4 desktop-table">

<div class="table-responsive">

<table class="table table-hover align-middle text-center">

<thead>

<tr>

<th>Poz.</th>
<th>Drużyna</th>
<th>M</th>
<th>Pkt</th>
<th>W</th>
<th>R</th>
<th>P</th>
<th>Gole</th>
<th>Bilans</th>

</tr>

</thead>

<tbody id="tabelaDesktop">

<tr>

<td colspan="9" class="loader">

<div class="spinner-border text-primary"></div>

<br><br>

Ładowanie...

</td>

</tr>

</tbody>

</table>

</div>

</div>


<!-- TELEFON -->

<div id="tabelaMobile" class="mobile-table">

<div class="loader">

<div class="spinner-border text-primary"></div>

<br><br>

Ładowanie...

</div>

</div>

</div>


<script>

const csvUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vRXfGQ9aSP4daJnc6w3HYy_iuscf_drnik4pjVMNUHla7d144GXncBMiNlZQgdUnEkXmIg-jd1UMXao/pub?output=csv";

fetch(csvUrl)

.then(response=>response.text())

.then(text=>{

    const rows=text.trim().split("\n");

    const desktop=document.getElementById("tabelaDesktop");
    const mobile=document.getElementById("tabelaMobile");
    const myTeam=document.getElementById("myTeamDesktop");

    desktop.innerHTML="";
    mobile.innerHTML="";

    let piastData=null;

    rows.forEach((row,index)=>{

        if(index===0) return;

        const cols=row.split(",").map(c=>c.replace(/"/g,"").trim());

        if(cols.length<10) return;

        const pozycja=cols[0];
        const druzyna=cols[1];
        const mecze=cols[2];
        const punkty=cols[3];
        const wygrane=cols[4];
        const remisy=cols[5];
        const porazki=cols[6];
        const golePlus=cols[7];
        const goleMinus=cols[8];
        const bilans=cols[9];

        const piast=druzyna.toUpperCase().includes("PIAST");


        /* ==========================
           ZAPISZ DANE PIASTA
        ========================== */

        if(piast){

            piastData={
                pozycja,
                druzyna,
                mecze,
                punkty,
                wygrane,
                remisy,
                porazki,
                golePlus,
                goleMinus,
                bilans
            };

        }


        /* ==========================
           PEŁNA TABELA - DESKTOP
        ========================== */

        desktop.innerHTML+=`

        <tr class="${piast ? "team-highlight":""}">

            <td class="position">${pozycja}</td>

            <td>${druzyna}</td>

            <td>${mecze}</td>

            <td class="points">${punkty}</td>

            <td>${wygrane}</td>

            <td>${remisy}</td>

            <td>${porazki}</td>

            <td>${golePlus} : ${goleMinus}</td>

            <td>${bilans}</td>

        </tr>

        `;


        /* ==========================
           PEŁNA TABELA - TELEFON
        ========================== */

        mobile.innerHTML+=`

        <div class="team-card ${piast ? "piast":""}">

            <div class="team-title">

                <h5>${druzyna}</h5>

                <span>#${pozycja}</span>

            </div>

            <div class="team-grid">

                <div class="info">

                    <small>Punkty</small>

                    <strong>${punkty}</strong>

                </div>

                <div class="info">

                    <small>Mecze</small>

                    <strong>${mecze}</strong>

                </div>

                <div class="info">

                    <small>Wygrane</small>

                    <strong>${wygrane}</strong>

                </div>

                <div class="info">

                    <small>Remisy</small>

                    <strong>${remisy}</strong>

                </div>

                <div class="info">

                    <small>Porażki</small>

                    <strong>${porazki}</strong>

                </div>

                <div class="info">

                    <small>Bilans</small>

                    <strong>${bilans}</strong>

                </div>

                <div class="info" style="grid-column:1 / span 2;">

                    <small>Gole</small>

                    <strong>${golePlus} : ${goleMinus}</strong>

                </div>

            </div>

        </div>

        `;

    });


    /* ==========================
       WYRÓŻNIONY PIAST NA GÓRZE
    ========================== */

    if(piastData){

        myTeam.innerHTML=`

            <div class="d-flex justify-content-between align-items-center">

                <div>

                    <div class="team-name">

                        <i class="bi bi-shield-fill-check"></i>

                        ${piastData.druzyna}

                    </div>

                    <div class="mt-1 opacity-75">

                        Twoja drużyna

                    </div>

                </div>

                <div class="position">

                    #${piastData.pozycja}

                </div>

            </div>


            <div class="my-team-grid">

                <div class="my-team-info points">

                    <small>Punkty</small>

                    <strong>${piastData.punkty}</strong>

                </div>

                <div class="my-team-info">

                    <small>Mecze</small>

                    <strong>${piastData.mecze}</strong>

                </div>

                <div class="my-team-info">

                    <small>Wygrane</small>

                    <strong>${piastData.wygrane}</strong>

                </div>

                <div class="my-team-info">

                    <small>Remisy</small>

                    <strong>${piastData.remisy}</strong>

                </div>

                <div class="my-team-info">

                    <small>Porażki</small>

                    <strong>${piastData.porazki}</strong>

                </div>

                <div class="my-team-info">

                    <small>Gole</small>

                    <strong>${piastData.golePlus} : ${piastData.goleMinus}</strong>

                </div>

                <div class="my-team-info">

                    <small>Bilans</small>

                    <strong>${piastData.bilans}</strong>

                </div>

            </div>

        `;

    }

})


.catch(error=>{

    document.getElementById("tabelaDesktop").innerHTML=`

        <tr>

            <td colspan="9" class="text-danger text-center py-5">

                <i class="bi bi-exclamation-triangle-fill fs-1"></i>

                <br><br>

                Nie udało się pobrać tabeli.

            </td>

        </tr>

    `;

    document.getElementById("tabelaMobile").innerHTML=`

        <div class="alert alert-danger text-center">

            <i class="bi bi-exclamation-triangle-fill"></i>

            <br><br>

            Nie udało się pobrać tabeli.

        </div>

    `;

    console.error(error);

});

</script>

</body>

</html>
