<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Catering Klubowy</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#edf2f7;
}

.header{
    background:linear-gradient(135deg,#0d6efd,#003b99);
    color:white;
    border-radius:20px;
    padding:35px;
    text-align:center;
    margin-bottom:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}


.image-card{
    background:#fff;
    border-radius:20px;
    padding:10px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
    overflow:hidden;
    text-align:center;
}

.menu-image{
    display:block;
    width:100%;
    height:auto;
    max-height:80vh;
    object-fit:contain;
    border-radius:14px;
    margin:0 auto;
}

</style>

</head>

<body>

<div class="container py-5">

    <!-- Przycisk Powrót -->
    <a href="index.html" class="btn btn-outline-primary rounded-pill px-4 mb-4">
        <i class="bi bi-arrow-left"></i>
        Powrót
    </a>

    <!-- Nagłówek -->
    <div class="header">
        <h1>
            <i class="bi bi-cup-hot-fill"></i>
            Terminarz klubowy
        </h1>

        <p class="mb-0">
            Aktualny terminarz klubowy
        </p>
    </div>

    <!-- Zdjęcia z Google Drive -->
    <div class="card p-4">
        <div id="galeria" class="row g-4 justify-content-center">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary"></div>
                <br><br>
                Ładowanie zdjęć...
            </div>
        </div>
    </div>

</div>

<script>

const apiUrl = "https://script.google.com/macros/s/AKfycbzF9mFp7ryv4HdKHpl2WZFKamu5XINi_fJNxYuBcOvmsPV_pTptr7SFzAWfp2k_TQmGYg/exec";

// Apps Script ContentService nie udostępnia poprawnie CORS dla fetch(),
// dlatego używamy JSONP.
const callbackName = "odbierzZdjecia_" + Date.now();

window[callbackName] = function(data) {

    const galeria = document.getElementById("galeria");

    try {

        if (!data || !data.success) {
            throw new Error(
                (data && data.error) || "API zwróciło błąd."
            );
        }

        galeria.innerHTML = "";

        if (!data.images || data.images.length === 0) {
            galeria.innerHTML = `
                <div class="col-12 text-center py-5 text-muted">
                    <i class="bi bi-image fs-1"></i>
                    <br><br>
                    Brak zdjęć w folderze.
                </div>
            `;
            return;
        }

        data.images.forEach(item => {

            const col = document.createElement("div");
            col.className = "col-12";

            const card = document.createElement("div");
            card.className = "image-card";

            const img = document.createElement("img");
            img.src = item.image;
            img.alt = item.name || "Menu";
            img.className = "img-fluid menu-image";
            img.loading = "lazy";

            card.appendChild(img);
            col.appendChild(card);
            galeria.appendChild(col);
        });

    } catch (error) {

        galeria.innerHTML = `
            <div class="col-12 text-center text-danger py-5">
                <i class="bi bi-exclamation-triangle-fill fs-2"></i>
                <br><br>
                Nie udało się pobrać zdjęć.
                <br>
                <small>${escapeHtml(error.message)}</small>
            </div>
        `;

        console.error(error);
    }

    // Sprzątamy globalny callback.
    delete window[callbackName];
};

// Dodajemy <script>, dzięki czemu przeglądarka może wykonać odpowiedź
// z Apps Script mimo ograniczeń CORS.
const script = document.createElement("script");
script.src = apiUrl + "?callback=" + encodeURIComponent(callbackName);
script.onerror = function() {

    document.getElementById("galeria").innerHTML = `
        <div class="col-12 text-center text-danger py-5">
            <i class="bi bi-exclamation-triangle-fill fs-2"></i>
            <br><br>
            Nie udało się połączyć z API Apps Script.
            <br>
            <small>Sprawdź wdrożenie Web App i dostęp dla użytkowników.</small>
        </div>
    `;

    delete window[callbackName];
};

document.head.appendChild(script);

function escapeHtml(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
