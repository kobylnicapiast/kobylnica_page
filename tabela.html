<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tabela Ligowa</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#edf2f7;
}

.header{
    background:linear-gradient(135deg,#0d6efd,#003b99);
    color:#fff;
    border-radius:20px;
    padding:35px;
    text-align:center;
    margin-bottom:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.table{
    border-radius:15px;
    overflow:hidden;
}

.table thead th{
    background:#0d6efd;
    color:white;
    text-align:center;
    vertical-align:middle;
    white-space:nowrap;
}

.table td{
    vertical-align:middle;
}

.table tbody tr{
    transition:.25s;
}

.table tbody tr:hover{
    background:#f5f9ff;
    transform:scale(1.01);
}

.table td:nth-child(2){
    text-align:left;
    font-weight:600;
}

.team-highlight{
    background:#d8eaff !important;
    color:#003b99;
    font-weight:bold;
}

.team-highlight td{
    border-top:2px solid #0d6efd;
    border-bottom:2px solid #0d6efd;
}

.points{
    font-weight:bold;
    color:#198754;
}

.position{
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container py-5">

    <a href="index.html" class="btn btn-outline-primary rounded-pill px-4 mb-4">
        <i class="bi bi-arrow-left"></i>
        Powrót
    </a>

    <div class="header">

        <h1>
            <i class="bi bi-trophy-fill"></i>
            Tabela Ligowa
        </h1>

        <p class="mb-0">
            Aktualna tabela pobierana z Google Sheets
        </p>

    </div>

    <div class="card p-4">

        <div class="table-responsive">

            <table class="table table-hover align-middle text-center">

                <thead>

                    <tr>
                        <th>Poz.</th>
                        <th>Drużyna</th>
                        <th>M</th>
                        <th>Pkt</th>
                        <th>W</th>
                        <th>R</th>
                        <th>P</th>
                        <th>Gole</th>
                        <th>Bilans</th>
                    </tr>

                </thead>

                <tbody id="tabela">

                    <tr>
                        <td colspan="9" class="text-center py-5">
                            <div class="spinner-border text-primary"></div>
                            <br><br>
                            Ładowanie tabeli...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

const csvUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vRXfGQ9aSP4daJnc6w3HYy_iuscf_drnik4pjVMNUHla7d144GXncBMiNlZQgdUnEkXmIg-jd1UMXao/pub?output=csv";

fetch(csvUrl)
.then(response=>response.text())
.then(text=>{

    const rows=text.trim().split("\n");
    const tbody=document.getElementById("tabela");

    tbody.innerHTML="";

    rows.forEach((row,index)=>{

        if(index===0) return;

        const cols=row.split(",").map(c=>c.replace(/"/g,"").trim());

        if(cols.length<10) return;

        const pozycja=cols[0];
        const druzyna=cols[1];
        const mecze=cols[2];
        const punkty=cols[3];
        const wygrane=cols[4];
        const remisy=cols[5];
        const porazki=cols[6];
        const golePlus=cols[7];
        const goleMinus=cols[8];
        const bilans=cols[9];

        const klasa=druzyna.toUpperCase().includes("PIAST")
            ? "team-highlight"
            : "";

        tbody.innerHTML+=`
        <tr class="${klasa}">
            <td class="position">${pozycja}</td>
            <td>${druzyna}</td>
            <td>${mecze}</td>
            <td class="points">${punkty}</td>
            <td>${wygrane}</td>
            <td>${remisy}</td>
            <td>${porazki}</td>
            <td>${golePlus} : ${goleMinus}</td>
            <td>${bilans}</td>
        </tr>
        `;

    });

})
.catch(error=>{

    document.getElementById("tabela").innerHTML=`
        <tr>
            <td colspan="9" class="text-danger text-center py-5">
                <i class="bi bi-exclamation-triangle-fill fs-1"></i>
                <br><br>
                Nie udało się pobrać tabeli.
            </td>
        </tr>
    `;

    console.error(error);

});

</script>

</body>
</html>
